name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract project
        run: unzip -q -o GameInsight-full.zip -d proj
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build
        working-directory: proj
        shell: bash
        run: |
          set +e
          gradle assembleDebug --no-daemon --console=plain > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            echo "=== ERRORS ==="
            grep -E "^e: |error:" build.log | head -30
            echo "=== WHAT WENT WRONG ==="
            grep -A12 "What went wrong" build.log | head -60
            echo "=== LOG TAIL ==="
            tail -n 40 build.log
            echo "=== END ==="
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: GameInsight-debug
          path: proj/app/build/outputs/apk/debug/app-debug.apk
