name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract project
        run: unzip -q -o GameInsight-full.zip -d proj
      - name: Find project root
        id: root
        shell: bash
        run: |
          f=$(find proj -name settings.gradle.kts -not -path "*/extras/*" | head -1)
          if [ -z "$f" ]; then
            echo "settings.gradle.kts NOT FOUND. Isi zip:"
            find proj | head -60
            exit 1
          fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"
          echo "Project dir: $(dirname "$f")"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build
        working-directory: ${{ steps.root.outputs.dir }}
        shell: bash
        run: |
          set +e
          gradle assembleDebug --no-daemon --console=plain > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            echo "=== ERRORS ==="
            grep -E "^e: |error:" build.log | head -30
            echo "=== WHAT WENT WRONG ==="
            grep -A12 "What went wrong" build.log | head -60
            echo "=== END ==="
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: GameInsight-debug
